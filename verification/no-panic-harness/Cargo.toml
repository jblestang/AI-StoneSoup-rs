[package]
name = "stonesoup-no-panic-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "stonesoup-no-panic-harness"
path = "src/main.rs"

[dependencies]
stonesoup-core = { path = "../../crates/stonesoup-core", features = ["no-panic-cert"] }
stonesoup-scenarios = { path = "../../crates/stonesoup-scenarios", features = ["no-panic-cert"] }
no-panic = "0.1.34"

[profile.no-panic-test]
inherits = "release"
panic = "unwind"
