[workspace]
resolver = "2"
exclude = ["verification/no-panic-harness"]
members = [
    "crates/stonesoup-core",
    "crates/stonesoup-sim",
    "crates/stonesoup-scenarios",
    "crates/stonesoup-io",
    "apps/stonesoup-viewer",
    "apps/stonesoup-headless",
    "verification/embedded-harness",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jblestang/stone-soup-rust"

[workspace.dependencies]
libm = "0.2.11"
serde = { version = "1.0.210", default-features = false, features = ["derive"] }
serde_json = "1.0.128"

[profile.release]
lto = "thin"

[profile.no-panic-test]
inherits = "release"
panic = "unwind"

# Used by verification/no-panic-harness (profile must be at workspace root).
