[package]
name = "stonesoup-core"
description = "Strict no_std core: types, models, Kalman filter, metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
libm = { workspace = true }

[dev-dependencies]
approx = "0.5.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
should_implement_trait = "allow"
needless_range_loop = "allow"
