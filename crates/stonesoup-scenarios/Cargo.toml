[package]
name = "stonesoup-scenarios"
description = "Executable scenario definitions (strict profile)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
no-panic-cert = ["stonesoup-core/no-panic-cert", "dep:no-panic"]

[dependencies]
stonesoup-core = { path = "../stonesoup-core" }
stonesoup-sim = { path = "../stonesoup-sim" }
libm = { workspace = true }
no-panic = { version = "0.1.34", optional = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
manual_unwrap_or = "allow"
question_mark = "allow"
