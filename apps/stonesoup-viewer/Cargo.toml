[package]
name = "stonesoup-viewer"
description = "Desktop and WASM scenario viewer (egui/eframe)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "stonesoup_viewer"
path = "src/lib.rs"

[[bin]]
name = "stonesoup-viewer"
path = "src/main.rs"

[dependencies]
stonesoup-core = { path = "../../crates/stonesoup-core" }
stonesoup-scenarios = { path = "../../crates/stonesoup-scenarios" }
eframe = { version = "0.29.1", default-features = true }
egui = "0.29.1"
egui_plot = "0.29.0"
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.43"
web-sys = { version = "0.3.70", features = ["Document", "Window", "HtmlCanvasElement"] }

[features]
default = []
